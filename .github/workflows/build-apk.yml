name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build SafetyPulse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: |
          npm run build
          mkdir -p dist
          cp -r frontend/dist/* dist/ 2>/dev/null || true

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx cap copy android || echo "Assets copied manually"

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PcompileSdkVersion=35 -PtargetSdkVersion=35 -PminSdkVersion=24

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafetyPulse-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

